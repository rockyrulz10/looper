<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Looper</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0c1114" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Looper" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="splash">
    <div class="splash-inner">
      <div class="splash-disc"><span class="splash-dot"></span></div>
      <h1>Looper <span class="app-version">v1.3.0</span></h1>
      <p class="splash-tag">Record loops · trigger samples · jam</p>
      <button id="btnEnable" class="btn-primary">Start Jamming</button>
      <p class="splash-hint">Microphone access is requested the first time you record.</p>
      <p id="splashError" class="splash-error"></p>
    </div>
  </div>

  <header class="app-header">
    <h1>Looper <span class="app-version" id="versionBadge">v1.3.0</span></h1>
    <div class="header-actions">
      <button id="btnPlayStop" class="btn-icon btn-playstop" aria-label="Play or stop all loops">▶</button>
      <button id="btnMenu" class="btn-icon" aria-label="Menu">⋯</button>
    </div>
    <div id="menu" class="menu hidden">
      <button id="menuImportLoop">⭱&nbsp; Import as loop</button>
      <button id="menuImportSample">⭯&nbsp; Import as sample</button>
      <button id="menuFix">↻&nbsp; Fix audio</button>
      <button id="menuClear" class="menu-danger">✕&nbsp; Clear session</button>
    </div>
    <input type="file" id="fileImport" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.flac" multiple hidden />
  </header>

  <main id="trackList" class="track-list"></main>

  <div id="emptyState" class="empty-state">
    <div class="empty-icon">◉</div>
    <p>Tap the button below to record<br />your first loop</p>
    <button id="emptyImport" class="btn-link">or import an audio file</button>
  </div>

  <section id="sampler" class="sampler">
    <div class="sampler-head">
      <span class="sampler-title">◇ Samples</span>
      <span class="sampler-hint">tap to record · tap to play · hold to edit · drag into a track</span>
      <button id="padAdd" class="pad-add-btn" title="Add a pad">＋</button>
    </div>
    <div id="padBank" class="pad-bank"></div>
  </section>

  <footer class="transport" id="transport">
    <div class="level-meter"><div id="levelMeterFill" class="level-meter-fill"></div></div>
    <div class="rec-wrap">
      <svg class="cycle-ring" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="ring-bg" cx="50" cy="50" r="46"></circle>
        <circle class="ring-fg" id="ringFg" cx="50" cy="50" r="46"></circle>
      </svg>
      <button id="btnRecord" class="btn-record" aria-label="Start recording">
        <span class="btn-record-dot"></span>
      </button>
    </div>
    <p id="diag" class="diag hidden"></p>
  </footer>

  <div id="toast" class="toast"></div>

  <!-- Sample editor sheet -->
  <div id="sampleSheet" class="sheet hidden">
    <div class="sheet-card">
      <div class="sheet-head">
        <input id="sampleName" class="sheet-name" type="text" maxlength="30" />
        <button id="sampleClose" class="btn-chip" aria-label="Close">✕</button>
      </div>
      <canvas id="sampleWave" class="sheet-wave" title="Drag the edges to trim"></canvas>
      <div class="sheet-row">
        <button id="samplePlay" class="btn-pill">▶ Play</button>
        <div class="vol-group"><span class="nudge-label">Vol</span>
          <input id="sampleVol" type="range" min="0" max="1.5" step="0.01" /></div>
      </div>
      <div class="sheet-row">
        <button id="sampleToTrack" class="btn-pill btn-pill-accent">＋ Add to arrangement</button>
        <button id="sampleDownload" class="btn-chip" aria-label="Download">⭳</button>
        <button id="sampleDelete" class="btn-chip btn-del" aria-label="Delete">🗑</button>
      </div>
    </div>
  </div>

  <!-- Floating chip shown while dragging a pad into the arrangement -->
  <div id="dragGhost" class="drag-ghost hidden"></div>

  <!-- In-app confirm dialog (nicer than the native popup in a PWA) -->
  <div id="confirmDlg" class="sheet confirm-overlay hidden">
    <div class="confirm-card">
      <p id="confirmMsg"></p>
      <div class="confirm-actions">
        <button id="confirmCancel" class="btn-pill">Cancel</button>
        <button id="confirmOk" class="btn-pill btn-pill-danger">Delete</button>
      </div>
    </div>
  </div>

  <!-- Loops a silent WAV whenever the app is active: playing file-backed
       media anchors Safari's audio session in the "media playback" category,
       which is what iOS routes to Bluetooth A2DP. -->
  <audio id="audioOut" playsinline style="display:none"></audio>

  <template id="trackTemplate">
    <section class="track-card">
      <div class="track-top">
        <button class="track-grip" aria-label="Drag to reorder" title="Drag to reorder">⠿</button>
        <input class="track-name" type="text" maxlength="30" />
        <span class="track-len"></span>
        <button class="btn-chip btn-mute" title="Mute">M</button>
        <button class="btn-chip btn-solo" title="Solo">S</button>
        <button class="btn-chip btn-expand" title="Edit loop" aria-label="Edit loop">▾</button>
      </div>
      <canvas class="track-waveform" title="Drag the edges to trim the loop"></canvas>
      <canvas class="track-lane" title="Drag to move · drag the right edge to set repeats"></canvas>
      <div class="track-details">
        <div class="track-loop-row">
          <div class="nudge-group" aria-label="Fine-trim loop start">
            <span class="nudge-label">Start</span>
            <button class="nudge" data-edge="start" data-delta="-0.01" aria-label="Start earlier">−</button>
            <button class="nudge" data-edge="start" data-delta="0.01" aria-label="Start later">+</button>
          </div>
          <span class="track-loop-info"></span>
          <div class="nudge-group" aria-label="Fine-trim loop end">
            <span class="nudge-label">End</span>
            <button class="nudge" data-edge="end" data-delta="-0.01" aria-label="End earlier">−</button>
            <button class="nudge" data-edge="end" data-delta="0.01" aria-label="End later">+</button>
          </div>
        </div>
        <div class="track-timing-row">
          <div class="nudge-group" aria-label="Fine-move this loop in the cycle">
            <span class="nudge-label">Place</span>
            <button class="nudge" data-edge="offset" data-delta="-0.01" title="0.01s earlier">◀</button>
            <span class="track-offset-info">@0.00s</span>
            <button class="nudge" data-edge="offset" data-delta="0.01" title="0.01s later">▶</button>
          </div>
          <div class="nudge-group" aria-label="How many times this loop plays per cycle">
            <span class="nudge-label">Loops</span>
            <select class="track-repeat">
              <option value="fill">Fill</option>
              <option value="1">×1</option>
              <option value="2">×2</option>
              <option value="3">×3</option>
              <option value="4">×4</option>
              <option value="6">×6</option>
              <option value="8">×8</option>
            </select>
          </div>
        </div>
        <div class="track-timing-row">
          <div class="fade-group" aria-label="Crossfade at the loop seam">
            <span class="nudge-label">Blend</span>
            <input class="track-fade" type="range" min="0" max="0.2" step="0.005" />
            <span class="track-fade-info">15ms</span>
          </div>
          <div class="vol-group" aria-label="Track volume">
            <span class="nudge-label">Vol</span>
            <input class="track-volume" type="range" min="0" max="1.5" step="0.01" value="1" />
          </div>
        </div>
        <div class="track-footer">
          <button class="btn-reset-loop">Reset</button>
          <span class="footer-spacer"></span>
          <button class="btn-chip btn-download" title="Download WAV">⭳</button>
          <button class="btn-chip btn-delete" title="Delete track">✕</button>
        </div>
      </div>
    </section>
  </template>

  <script src="storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
